name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Testes (vitest)
        run: bun run test
      - name: Build
        run: bun run build

  # Lint sem erros e sem aumentar o teto de avisos (dívida legada de `any`).
  # Ao tipar usos de `any`, baixar o valor de --max-warnings.
  lint-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint --max-warnings 32
      - run: bunx tsc -p tsconfig.app.json --noEmit
